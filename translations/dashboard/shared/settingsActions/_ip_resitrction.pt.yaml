allowedIps: "Endereços IP Permitidos"
allowedIpsDescription: "Especifique os endereços IP ou gamas CIDR permitidos a aceder ao painel de administração. Deixe em branco para permitir o acesso a partir de qualquer endereço IP."
addIp: "Adicionar Endereço IP"
noAllowedIps: "Nenhuma restrição de IP configurada. O acesso está aberto a todos os IPs."
