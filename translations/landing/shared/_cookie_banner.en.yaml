cookiesDescription: 'This platform uses cookies to provide a seamless experience when connecting to the OpenRoaming network. These cookies are essential for provisioning your device securely, enabling automatic authentication, and ensuring compliance with our policies. By using our platform, you consent to the use of these cookies.'
essentialCookiesText: 'These cookies are essential for the platform to function properly and cannot be disabled.'
dataSafetyText: 'Your data is safe with us. Learn more in our'

controlledBy: 'Controlled by'
cookieName: 'Cookie'
duration: 'Duration'
privacyPolicy: 'Privacy Policy'
manageableCookiesTitle: 'Manageable Cookies'
manageableCookiesDescription: 'These cookies help us understand how you like to use our platform.'
sessionCookie:
    title: 'Session Cookie'
    description: 'This cookie is essential for maintaining the user session state during its duration. It allows the platform to function properly and ensures a seamless user experience.'
    duration: 'Until the browser is closed'
csrfToken:
    title: 'CSRF Token'
    description: 'Protects against cross-site request forgery (CSRF) attacks by ensuring that forms and requests are submitted from trusted sources.'
    duration: 'Until the form is submitted or the browser is closed'
consentCookie:
    title: 'Cookie Consent'
    description: 'Stores your cookie choices, so this banner is not shown again and your preferences are respected.'
    duration: '1 year'
samlReauthCookie:
    title: 'SAML Account Deletion'
    description: 'Used only when an account created with SAML is deleted, to confirm your identity after you sign in again with your identity provider.'
    duration: '1 minute'
recaptchaCookie:
    title: 'Google reCAPTCHA'
    description: 'Set by Google reCAPTCHA v3 to tell people and bots apart, protecting the login, registration and password reset forms from spam and abuse.'
    duration: 'Up to 6 months (set by Google)'
turnstileCookie:
    title: 'Cloudflare Turnstile'
    description: 'Security cookies that Cloudflare may set while Turnstile checks that you are not a bot, protecting the login, registration and password reset forms from spam and abuse.'
    duration: 'Short-lived (set by Cloudflare)'
rememberMeCookie:
    title: 'Remember Me'
    description: 'Saves user session if the account was previously active.'
    duration: '7 days'
locationCookie:
    title: "Location Cookies"
    description: "Allows us to obtain your approximate location through the browser to automatically center the map on your region and improve your experience."
