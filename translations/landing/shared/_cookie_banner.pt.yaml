title: 'Definições de Cookies'
subTitle: 'Cookies Necessários'
text: 'Ao aceitar cookies, está a consentir em transferir e instalar um perfil OpenRoaming para o seu dispositivo como parte do programa WBA OpenRoaming.'
accept: 'Aceitar Cookies'
reject: 'Rejeitar Cookies'
apply: 'Aplicar Cookies'
settings: 'Configurações de Cookies'
manage: 'Gerir Cookies'
close: 'Fechar'
cookiesDescription: 'Esta plataforma usa cookies para fornecer uma experiência estável ao conectar-se à rede OpenRoaming. Estes cookies são essenciais para conectar o seu dispositivo com segurança, possibilitando uma autenticação automática e garantir conformidade com as nossas políticas. Ao usar a nossa plataforma, concorda com o uso desses cookies.'
essentialCookiesText: 'Estes cookies são essenciais para o funcionamento adequado da plataforma e não podem ser desativados.'
dataSafetyText: 'Os seus dados estão seguros connosco. Saiba mais na nossa'

controlledBy: 'Controlado por'
cookieName: 'Cookie'
duration: 'Duração'
privacyPolicy: 'Política de Privacidade'
manageableCookiesTitle: 'Cookies Gerenciáveis'
manageableCookiesDescription: 'Estes cookies ajudam-nos a compreender como prefere usar a nossa plataforma.'
sessionCookie:
    title: 'Cookie de Sessão'
    description: 'Este cookie é essencial para manter o estado da sessão do utilizador durante a duração da mesma. Permite que a plataforma funcione corretamente e garante uma experiência de utilizador estável.'
    duration: 'Até o navegador ser fechado'
csrfToken:
    title: 'Token CSRF'
    description: 'Protege contra ataques de falsificação de pedidos entre sites (CSRF), garantindo que formulários e pedidos sejam enviados a partir de fontes confiáveis.'
    duration: 'Até o formulário ser enviado ou o navegador ser fechado'
consentCookie:
    title: 'Consentimento de Cookies'
    description: 'Guarda as suas escolhas de cookies, para que este aviso não volte a aparecer e as suas preferências sejam respeitadas.'
    duration: '1 ano'
samlReauthCookie:
    title: 'Eliminação de Conta SAML'
    description: 'Usado apenas quando uma conta criada com SAML é eliminada, para confirmar a sua identidade depois de iniciar sessão novamente no seu fornecedor de identidade.'
    duration: '1 minuto'
recaptchaCookie:
    title: 'Google reCAPTCHA'
    description: 'Definido pelo Google reCAPTCHA v3 para distinguir pessoas de bots, protegendo os formulários de login, registo e recuperação de palavra-passe contra spam e abuso.'
    duration: 'Até 6 meses (definido pela Google)'
turnstileCookie:
    title: 'Cloudflare Turnstile'
    description: 'Cookies de segurança que a Cloudflare pode definir enquanto o Turnstile verifica que não é um bot, protegendo os formulários de login, registo e recuperação de palavra-passe contra spam e abuso.'
    duration: 'Curta duração (definido pela Cloudflare)'
rememberMeCookie:
    title: 'Lembra-te de mim'
    description: 'Guarda a sessão do utilizador se a conta estiver previamente ativa.'
    duration: '7 dias'
locationCookie:
    title: "Cookies de Localização"
    description: "Permite-nos obter a sua localização aproximada através do navegador para centrar o mapa automaticamente na sua região e melhorar a sua experiência."
