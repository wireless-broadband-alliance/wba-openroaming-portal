image: docker:latest
services:
  - docker:dind
stages:
  - prepare
  - lint
  - test
  - build
  - scan

variables:
  DS_MAX_DEPTH: "-1"
  DS_EXCLUDED_PATHS: "vendor, node_modules, var, public"


workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

build_test_image:
  stage: prepare
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker pull $CI_REGISTRY_IMAGE:cra-tests || true
    - docker build --cache-from $CI_REGISTRY_IMAGE:cra-tests -t $CI_REGISTRY_IMAGE:cra-tests -f DockerfileTests .
    - docker push $CI_REGISTRY_IMAGE:cra-tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - DockerfileTests
        - composer.lock
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - DockerfileTests
        - composer.lock
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

linting-psr12:
  stage: lint
  image: registry.gitlab.com/pipeline-components/php-codesniffer:latest
  script:
    - phpcs -s -p --colors --extensions=php --standard=PSR12 src/

php-security-checker:
  stage: test
  image: registry.gitlab.com/pipeline-components/php-security-checker:latest
  script:
    - cd ${COMPOSER_LOCATION:-.} && security-checker security:check composer.lock

yamllint:
  image: registry.gitlab.com/pipeline-components/yamllint:latest
  allow_failure: false
  script:
    - yamllint -f colored -c yamllint.yaml .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: never
  stage: lint


test-rector:
  image: "$CI_REGISTRY_IMAGE:cra-tests"
  allow_failure: false
  variables:
    COMPOSER_MEMORY_LIMIT: "-1"
  before_script:
    - cp .env.sample .env
    - echo "memory_limit=2G" > /usr/local/etc/php/conf.d/memory.ini || true
    - COMPOSER_CACHE_DIR=composer-cache composer install
  script:
    - vendor/bin/rector process src --dry-run
  stage: test

test-twig:
  image: "$CI_REGISTRY_IMAGE:cra-tests"
  allow_failure: false
  variables:
    COMPOSER_MEMORY_LIMIT: "-1"
  before_script:
    - cp .env.sample .env
    - echo "memory_limit=2G" > /usr/local/etc/php/conf.d/memory.ini || true
    - COMPOSER_CACHE_DIR=composer-cache composer install
  script:
    - vendor/bin/twig-cs-fixer lint ./templates
  stage: test

test-phpstan:
  image: "$CI_REGISTRY_IMAGE:cra-tests"
  allow_failure: false
  variables:
    COMPOSER_MEMORY_LIMIT: "-1"
  before_script:
    - cp .env.sample .env
    - echo "memory_limit=2G" > /usr/local/etc/php/conf.d/memory.ini || true
    - COMPOSER_CACHE_DIR=composer-cache composer install
  script:
    - php -d memory_limit=4G vendor/bin/phpstan analyse --error-format=gitlab --no-progress . > gl-code-quality-report.json || true
    - php -d memory_limit=4G vendor/bin/phpstan analyse .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
  stage: test

eslint:
  image: node:latest
  script:
    - npm install
    - npx eslint assets/controllers/
  stage: test


prettier:
  image: node:latest
  script:
    - npm install
    - npx prettier --check assets/controllers/
  stage: test

build_image:
  stage: build
  script:
    - if [ -z "$CI_COMMIT_TAG" ]; then CI_COMMIT_TAG=$CI_COMMIT_SHORT_SHA; fi
    - docker build --build-arg CICDVERSION=$CI_COMMIT_TAG -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME

trivy-scan:
  stage: scan
  allow_failure: false
  variables:
    DOCKER_DRIVER: overlay2
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - |
      export TRIVY_VERSION=$(wget -qO - "https://api.github.com/repos/aquasecurity/trivy/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
      echo "Trivy version: $TRIVY_VERSION"
      wget --no-verbose "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -O - | tar -zxvf -
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - if [ -z "$CI_COMMIT_TAG" ]; then CI_COMMIT_TAG=$CI_COMMIT_SHORT_SHA; fi
    - |
      IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
      echo "Scanning Docker image: $IMAGE"
      ./trivy image --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --ignore-status will_not_fix,fix_deferred,fixed --format template --template "@contrib/gitlab.tpl" -o trivy-image-report.json "$IMAGE"
      ./trivy image --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --ignore-status will_not_fix,fix_deferred,fixed --format table "$IMAGE"
    # Syft: Generate container SBOM targeting final Docker image layers
    - echo "Generating Container SBOM for $IMAGE using Syft"
    - syft "$IMAGE" -o cyclonedx-json=gl-sbom-image.cdx.json
    - syft "$IMAGE" -o spdx-json=sbom-image.spdx.json
    - syft "$IMAGE" -o table
    # Filesystem CycloneDX SBOM scan (Source dependencies & License Scanning)
    - echo "Generating Filesystem CycloneDX SBOM and License Scanning Report"
    - ./trivy fs --scanners vuln,license --format cyclonedx -o gl-sbom-fs.cdx.json .
    # Scan do Dockerfile
    - echo "Scanning Dockerfile"
    - ./trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format template --template "@contrib/gitlab.tpl" -o trivy-dockerfile-report.json ./Dockerfile
    - ./trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format table ./Dockerfile
  artifacts:
    paths:
      - trivy-image-report.json
      - trivy-dockerfile-report.json
      - gl-sbom-image.cdx.json
      - gl-sbom-fs.cdx.json
      - sbom-image.spdx.json
    expire_in: 1 hour
    reports:
      container_scanning: trivy-image-report.json
      cyclonedx:
        - gl-sbom-image.cdx.json
        - gl-sbom-fs.cdx.json


include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
