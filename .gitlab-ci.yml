image: docker:latest
services:
  - docker:dind

# Pipeline Stages
stages:
  - prepare
  - test
  - security
  - build

variables:
  DS_MAX_DEPTH: "-1"
  DS_EXCLUDED_PATHS: "vendor, node_modules, var, public"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ==============================================================================
# STAGE 1: prepare - Build and cache test Docker container
# ==============================================================================

# Rebuilds the Docker test environment image when DockerfileTests or composer.lock is updated
build_test_image:
  stage: prepare
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker pull $CI_REGISTRY_IMAGE:cra-tests || true
    - docker build --cache-from $CI_REGISTRY_IMAGE:cra-tests -t $CI_REGISTRY_IMAGE:cra-tests -f DockerfileTests .
    - docker push $CI_REGISTRY_IMAGE:cra-tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - DockerfileTests
        - composer.lock
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - DockerfileTests
        - composer.lock
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ==============================================================================
# STAGE 2: test - Code quality linters, formatting, and static analysis
# ==============================================================================

# Checks PHP source code against PSR-12 coding standards using PHP_CodeSniffer
linting-psr12:
  stage: test
  image: registry.gitlab.com/pipeline-components/php-codesniffer:latest
  needs: []
  script:
    - phpcs -s -p --colors --extensions=php --standard=PSR12 src/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Validates syntax and formatting of YAML configuration files
yamllint:
  stage: test
  image: registry.gitlab.com/pipeline-components/yamllint:latest
  allow_failure: false
  needs: []
  script:
    - yamllint -f colored -c yamllint.yaml .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Lints JavaScript controllers and assets using ESLint
eslint:
  stage: test
  image: node:latest
  needs: []
  cache:
    key: "${CI_COMMIT_REF_SLUG}-npm"
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline || npm install
    - npx eslint assets/controllers/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Checks JavaScript formatting against Prettier guidelines
prettier:
  stage: test
  image: node:latest
  needs: []
  cache:
    key: "${CI_COMMIT_REF_SLUG}-npm"
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline || npm install
    - npx prettier --check assets/controllers/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Lints shell scripts in scripts/ and tools/ using ShellCheck
shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:latest
  needs: []
  script:
    - shellcheck scripts/*.sh tools/*.sh || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Runs Rector in dry-run mode to check for PHP code upgrades and deprecations
test-rector:
  stage: test
  image: "$CI_REGISTRY_IMAGE:cra-tests"
  allow_failure: false
  needs: [{ job: build_test_image, optional: true }]
  cache:
    key: "${CI_COMMIT_REF_SLUG}-composer"
    paths:
      - composer-cache/
  variables:
    COMPOSER_MEMORY_LIMIT: "-1"
  before_script:
    - cp .env.sample .env
    - echo "memory_limit=2G" > /usr/local/etc/php/conf.d/memory.ini || true
    - COMPOSER_CACHE_DIR=composer-cache composer install
  script:
    - vendor/bin/rector process src --dry-run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Checks Twig template syntax and code formatting standards
test-twig:
  stage: test
  image: "$CI_REGISTRY_IMAGE:cra-tests"
  allow_failure: false
  needs: [{ job: build_test_image, optional: true }]
  cache:
    key: "${CI_COMMIT_REF_SLUG}-composer"
    paths:
      - composer-cache/
  variables:
    COMPOSER_MEMORY_LIMIT: "-1"
  before_script:
    - cp .env.sample .env
    - echo "memory_limit=2G" > /usr/local/etc/php/conf.d/memory.ini || true
    - COMPOSER_CACHE_DIR=composer-cache composer install
  script:
    - vendor/bin/twig-cs-fixer lint ./templates
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Performs static type analysis on PHP codebase using PHPStan
test-phpstan:
  stage: test
  image: "$CI_REGISTRY_IMAGE:cra-tests"
  allow_failure: false
  needs: [{ job: build_test_image, optional: true }]
  cache:
    key: "${CI_COMMIT_REF_SLUG}-composer"
    paths:
      - composer-cache/
  variables:
    COMPOSER_MEMORY_LIMIT: "-1"
  before_script:
    - cp .env.sample .env
    - echo "memory_limit=2G" > /usr/local/etc/php/conf.d/memory.ini || true
    - COMPOSER_CACHE_DIR=composer-cache composer install
  script:
    - php -d memory_limit=4G vendor/bin/phpstan analyse --error-format=gitlab --no-progress . > gl-code-quality-report.json || true
    - php -d memory_limit=4G vendor/bin/phpstan analyse .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ==============================================================================
# STAGE 3: security - Dedicated Security Scans & Static Analysis
# ==============================================================================

# Checks composer.lock for known security vulnerabilities in PHP packages
php-security-checker:
  stage: security
  image: registry.gitlab.com/pipeline-components/php-security-checker:latest
  needs: []
  script:
    - cd ${COMPOSER_LOCATION:-.} && security-checker security:check composer.lock
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Scans Dockerfile, docker-compose, and server configs for security misconfigurations using Trivy
iac-config-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  before_script:
    - mkdir -p contrib
    - wget -qO contrib/gitlab.tpl https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl || true
  script:
    - if [ -f contrib/gitlab.tpl ]; then trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format template --template "@contrib/gitlab.tpl" -o trivy-iac-report.json . ; else trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format json -o trivy-iac-report.json . ; fi
    - trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM .
  artifacts:
    when: always
    paths:
      - trivy-iac-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Include GitLab template security scanners
include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

.sast-analyzer:
  stage: security
  needs: []

.secret-analyzer:
  stage: security
  needs: []

.dependency-scanning-analyzer:
  stage: security
  needs: []

# Scans source code for hardcoded secrets, keys, and tokens
secret_detection:
  stage: security
  needs: []

# Runs Static Application Security Testing (SAST) on source code
sast:
  stage: security
  needs: []

# Analyzes project dependencies for known security vulnerabilities
dependency_scanning:
  stage: security
  needs: []

# ==============================================================================
# STAGE 4: build - Production Docker image compilation & final container scanning
# ==============================================================================

# Compiles and pushes the production Docker image (only runs after test and security stages pass)
build_image:
  stage: build
  script:
    - if [ -z "$CI_COMMIT_TAG" ]; then CI_COMMIT_TAG=$CI_COMMIT_SHORT_SHA; fi
    - docker build --build-arg CICDVERSION=$CI_COMMIT_TAG -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME

# Scans the production Docker image for vulnerabilities, generates SBOMs, and enforces critical security gates
trivy-scan:
  stage: build
  needs: ["build_image"]
  allow_failure: false
  variables:
    DOCKER_DRIVER: overlay2
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - |
      export TRIVY_VERSION=$(wget -qO - "https://api.github.com/repos/aquasecurity/trivy/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
      echo "Trivy version: $TRIVY_VERSION"
      wget --no-verbose "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -O - | tar -zxvf -
      echo "Installing Syft..."
      wget -qO- https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b .
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - if [ -z "$CI_COMMIT_TAG" ]; then CI_COMMIT_TAG=$CI_COMMIT_SHORT_SHA; fi
    - |
      IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
      echo "Scanning Docker image: $IMAGE"
      ./trivy image --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --ignore-status will_not_fix,fix_deferred,fixed --format template --template "@contrib/gitlab.tpl" -o trivy-image-report.json "$IMAGE"
      ./trivy image --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --ignore-status will_not_fix,fix_deferred,fixed --format table "$IMAGE"
      # Fail build if CRITICAL unmitigated vulnerabilities are present
      ./trivy image --exit-code 1 --severity CRITICAL --ignore-status will_not_fix,fix_deferred,fixed "$IMAGE"
    # Syft: Generate container SBOM targeting final Docker image layers
    - echo "Generating Container SBOM for $IMAGE using Syft"
    - ./syft "$IMAGE" -o cyclonedx-json=gl-sbom-image.cdx.json
    - ./syft "$IMAGE" -o spdx-json=sbom-image.spdx.json
    - ./syft "$IMAGE" -o table
    # Filesystem CycloneDX SBOM scan (Source dependencies & License Scanning)
    - echo "Generating Filesystem CycloneDX SBOM and License Scanning Report"
    - ./trivy fs --scanners vuln,license --format cyclonedx -o gl-sbom-fs.cdx.json .
    # Scan Dockerfile
    - echo "Scanning Dockerfile"
    - ./trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format template --template "@contrib/gitlab.tpl" -o trivy-dockerfile-report.json ./Dockerfile
    - ./trivy config --exit-code 0 --severity HIGH,CRITICAL,MEDIUM --format table ./Dockerfile
  artifacts:
    paths:
      - trivy-image-report.json
      - trivy-dockerfile-report.json
      - gl-sbom-image.cdx.json
      - gl-sbom-fs.cdx.json
      - sbom-image.spdx.json
    expire_in: 1 hour
    reports:
      container_scanning: trivy-image-report.json
      cyclonedx:
        - gl-sbom-image.cdx.json
        - gl-sbom-fs.cdx.json
