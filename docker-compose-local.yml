---
services:
  web:
    build:
      context: .
      dockerfile: DockerfileDev
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - ./:/var/www/openroaming
      - ./pgp_public_key/:/var/www/openroaming/pgp_public_key/
      - ./var/certs/:/var/www/openroaming/var/certs/
      - ./service-config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./service-config/nginx/sites:/etc/nginx/conf.d:ro
      - ./service-config/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./service-config/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./config/jwt/:/var/www/openroaming/config/jwt/
    ports:
      - "80:80"
  mysql:
    image: mysql:8.0
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openroaming}
      MYSQL_USER: ${MYSQL_USER:-openroaming}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
      - ./service-config/mysql/ssl.cnf:/etc/mysql/conf.d/ssl.cnf:ro
  memcached:
    image: memcached:1.6
    security_opt:
      - no-new-privileges:true
  mailcatcher:
    image: schickling/mailcatcher
    security_opt:
      - no-new-privileges:true
    ports:
      - '1080:1080'
      - '1025:1025'

volumes:
  mysql:
    driver: local
